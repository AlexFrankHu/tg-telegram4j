server:
  port: 8080

telegram:
  # Directory to store telegram4j session files (t4j.bin)
  data-dir: ./data
  # Session auto-login on startup (configure these to auto-connect when app starts)
  session-name: ""
  session-file-path: ""
  # Default API credentials (can be overridden per request)
  # Get yours from https://my.telegram.org/apps
  api-id: 0
  api-hash: ""
  # SOCKS5 proxy (for environments that cannot access Telegram directly)
  proxy:
    enabled: false
    host: 127.0.0.1
    port: 1080
    username:
    password:

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.tg.telegram4j: DEBUG
    telegram4j: INFO
